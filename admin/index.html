<style>
:root{--forest:#064E35;--green:#16834A;--leaf:#65A765;--mist:#F1F8F2;--line:#d9eadc;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--mist);color:#24473a;font:15px/1.5 "Segoe UI",system-ui,Arial,sans-serif}
h1,h2,h3{font-family:Georgia,serif;color:var(--forest);margin:0 0 10px}
h1{font-size:1.5rem}h2{font-size:1.15rem}
.hide{display:none!important}small{color:#5d7b6c}
button,.btn{background:var(--green);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
button:hover{background:var(--forest)}button:disabled{opacity:.5;cursor:wait}
button.ghost{background:#fff;color:var(--green);border:1px solid var(--green)}
button.danger{background:#fff;color:#b3261e;border:1px solid #e3b5b1}

input[type=text],input[type=email],input[type=password],input[type=number],textarea,select{width:100%;padding:10px 12px;border:1px solid #bcd8c2;border-radius:10px;font:inherit;background:#fff}
textarea{min-height:84px;resize:vertical}
label{display:block;font-weight:600;font-size:.85rem;margin:12px 0 4px;color:var(--forest)}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lc{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;width:100%;max-width:380px;box-shadow:0 14px 40px rgba(6,78,53,.08)}
.lc .brand{text-align:center;margin-bottom:18px}
/* app */
#app{display:flex;min-height:100vh}
aside{width:250px;background:var(--forest);color:#fff;padding:18px 12px;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:30;transition:transform .25s}
aside .logo{font:700 1.05rem Georgia,serif;padding:6px 12px 18px;letter-spacing:.04em}
aside nav a{display:block;padding:11px 14px;border-radius:10px;color:#d8f0dc;cursor:pointer;margin-bottom:2px}
aside nav a:hover{background:rgba(255,255,255,.08)}
aside nav a.on{background:#fff;color:var(--forest);font-weight:700}
aside .foot{margin-top:auto;padding:12px;font-size:.8rem;color:#a9dcb0;word-break:break-all}
.content{flex:1;margin-left:250px;min-width:0}
.top{background:#fff;border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:20}
#burger{display:none;padding:8px 12px}
main{padding:18px;max-width:1000px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{display:block;font:700 1.7rem Georgia,serif;color:var(--forest)}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-child{border-top:0}.grow{flex:1;min-width:140px}
.thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;background:var(--mist);border:1px solid var(--line)}
.thumb.round{border-radius:50%}
.badge{display:inline-block;background:#e6f3e8;color:var(--forest);border-radius:999px;padding:2px 12px;font-size:.78rem;font-weight:700}
.badge.submitted,.badge.under_review{background:#fff4d6;color:#7a5a00}
.badge.rejected{background:#fdeceb;color:#8a1c14}
.msg{padding:10px 14px;border-radius:10px;margin-bottom:12px;background:#e6f3e8;color:var(--forest)}.msg.err{background:#fdeceb;color:#8a1c14}
.kv{display:grid;grid-template-columns:minmax(110px,40%) 1fr;gap:6px 12px;padding:6px 0;border-top:1px solid var(--line);word-break:break-word}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.tools input{flex:1;min-width:150px}.tools select{width:auto}
.network-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.network-panel{border:1px solid var(--line);border-radius:12px;padding:14px}.network-panel h2{font-size:1rem}.network-row{border-top:1px solid var(--line);padding:8px 0}.network-row:first-child{border-top:0}.network-controls{display:grid;grid-template-columns:minmax(0,1fr) 110px 120px;gap:8px}.network-controls select,.network-controls button{width:100%}@media(max-width:860px){.network-grid{grid-template-columns:1fr}.network-controls{grid-template-columns:1fr}}
.account-table-wrap{overflow:auto}.account-table{width:100%;border-collapse:collapse;font-size:.88rem}.account-table th,.account-table td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}.account-table th{color:var(--forest);font-size:.78rem}.account-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.account-tools input,.account-tools select{flex:1;min-width:150px}.account-stats{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}.account-stat{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}.account-stat b{display:block;font:700 1.3rem Georgia,serif;color:var(--forest)}
.admin-distributor-id{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,#064E35,#16834A);color:#fff;border-radius:10px;padding:16px}.admin-distributor-id img,.admin-distributor-id-placeholder{width:84px;height:100px;border:2px solid #fff;border-radius:7px;object-fit:cover;background:#fff;flex:none}.admin-distributor-id-placeholder{display:grid;place-items:center;color:var(--forest);font:700 1.8rem Georgia,serif}.admin-distributor-id small{display:block;color:#d8f0dc}.admin-distributor-id b{display:block;color:#fff}.admin-distributor-id .code{font:700 1.2rem Georgia,serif;letter-spacing:.04em}.admin-distributor-meta{overflow-wrap:anywhere;font-size:.82rem;color:#eef8ef}
.owner-tree-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.owner-tree-toolbar input{flex:1;min-width:220px;padding:9px 12px;border:1px solid #bcd8c2;border-radius:8px;font:inherit}.owner-tree-toolbar button{width:38px;height:36px;padding:0}.owner-tree-viewport{height:min(620px,70vh);overflow:hidden;border:1px solid var(--line);border-radius:12px;background:linear-gradient(#f8fbf8,#fff);cursor:grab;touch-action:none}.owner-tree-viewport.dragging{cursor:grabbing}.owner-tree-canvas{display:inline-block;min-width:max-content;padding:28px 80px;transform-origin:50% 0;transition:transform .08s}.owner-org{display:flex;flex-direction:column;align-items:center}.owner-children{display:flex;justify-content:center;gap:72px;margin-top:62px;position:relative}.owner-children::before{content:"";position:absolute;top:-31px;left:25%;right:25%;border-top:2px solid #9fc3a6}.owner-node{display:flex;flex-direction:column;align-items:center;position:relative;min-width:210px}.owner-node::before{content:"";position:absolute;top:-31px;height:31px;border-left:2px solid #9fc3a6}.owner-node-label{font-size:.68rem;font-weight:800;letter-spacing:.08em;color:#5d806b;margin-bottom:7px}.owner-card{width:190px;min-height:72px;border:1px solid var(--line);border-radius:9px;border-top:4px solid var(--green);background:#fff;padding:10px 12px;text-align:center;color:var(--forest);font-weight:700;cursor:pointer;box-shadow:0 5px 16px rgba(6,78,53,.09)}.owner-card.right{border-top-color:#65A765}.owner-card.owner-root{width:230px;background:var(--forest);border-color:var(--forest);color:#fff}.owner-card small{display:block;font-size:.72rem;font-weight:400;color:#6c8177;margin-top:4px}.owner-card.owner-root small{color:#d8f0dc}.owner-slot{width:190px;min-height:72px;border:1px dashed #98bca0;border-radius:9px;background:#eef6ef;padding:12px;text-align:center;color:#718c77;font-size:.82rem} .owner-card.search-hit{outline:3px solid #f0c36b;outline-offset:3px}.owner-distributor-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.owner-distributor-table{overflow-x:auto}.owner-distributor-table table{width:100%;border-collapse:collapse;font-size:.86rem}.owner-distributor-table th{text-align:left;color:var(--forest);background:var(--mist);padding:9px;border-bottom:1px solid var(--line)}.owner-distributor-table td{padding:10px 9px;border-bottom:1px solid var(--line);vertical-align:middle}.owner-distributor-table tr:hover td{background:#fbfdfb}.owner-card-actions{display:flex;justify-content:center;gap:5px;margin-top:7px}.owner-card-actions button{font-size:.68rem;padding:4px 7px}.owner-tree-picker{width:190px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:8px;text-align:left}.owner-tree-picker select{width:100%;font-size:.72rem;margin-bottom:5px}.owner-rosters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:12px}.owner-roster{border:1px solid var(--line);border-radius:10px;background:#fff;padding:12px}.owner-roster summary{cursor:pointer;font-weight:700;color:var(--forest)}.owner-roster-list{max-height:220px;overflow:auto;margin-top:10px}.owner-roster-row{display:flex;justify-content:space-between;gap:12px;padding:8px;border-top:1px solid var(--line);cursor:pointer}.owner-roster-row:first-child{border-top:0}.owner-roster-row:hover{background:var(--mist)}@media(max-width:760px){.owner-rosters{grid-template-columns:1fr}}.binary-tree{overflow-x:auto;padding:24px 12px;text-align:center}.binary-root{display:inline-flex}.binary-node{display:flex;flex-direction:column;align-items:center}.binary-card{min-width:150px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--forest);font-weight:700;box-shadow:0 4px 12px rgba(6,78,53,.06)}.binary-card small{display:block;font-weight:400}.binary-children{display:flex;justify-content:center;gap:28px;position:relative;padding-top:24px}.binary-children::before{content:"";position:absolute;top:0;left:25%;right:25%;height:2px;background:#bcd8c2}.binary-child{position:relative;padding-top:24px}.binary-child::before{content:"";position:absolute;top:0;left:50%;height:24px;border-left:2px solid #bcd8c2}.binary-slot{min-width:150px;border:1px dashed #a8c8b0;border-radius:10px;padding:9px;color:#769080;background:var(--mist)}details.binary-node summary{cursor:pointer;list-style:none}.binary-branch{font-size:.72rem;letter-spacing:.08em;color:#5d7b6c;margin-bottom:4px}
@media(max-width:860px){
 aside{transform:translateX(-100%)}aside.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
 .content{margin-left:0}#burger{display:block}main{padding:12px}
}
</style>

<body>

<div id="login" class="hide">
 <form class="lc" id="lf" autocomplete="on">
  <div class="brand"><h1>🌿 AYU LIFE HEARBAL</h1><small>Administrator sign in</small></div>
  <div id="lmsg"></div>
  <label>Email</label><input type="email" id="em" autocomplete="username" required>
  <label>Password</label><input type="password" id="pw" autocomplete="current-password" required>
  <p style="margin:18px 0 0"><button style="width:100%" id="lgo">Sign in</button></p>
 </form>
</div>

<div id="app" class="hide">
 <aside id="side">
  <div class="logo">🌿 AYU LIFE HEARBAL<br><small style="color:#a9dcb0;font-weight:400;font-family:sans-serif">Admin Panel</small></div>
  <nav id="nav">
   <a data-s="dashboard">📊 Dashboard</a>
   <a data-s="owner-tree">🌳 Owner Direct Tree</a>
   <a data-s="distributors">🤝 Distributors</a>
  <a data-s="distributor-accounts">💼 Distributor Accounts</a>
   <a data-s="users">👥 Users &amp; Accounts</a>
   <a data-s="products">🌿 Products</a>
   <a data-s="gallery">🖼️ Gallery</a>
   <a data-s="content">📝 Website Content</a>
   <a data-s="settings">⚙️ Settings</a>
  </nav>
  <div class="foot"><span id="who"></span><br><button class="ghost sm" id="out" style="margin-top:8px">Sign out</button></div>
 </aside>
 <div class="content">
  <div class="top"><button id="burger" class="ghost">☰</button><h1 id="title" style="margin:0">Dashboard</h1></div>
  <main><div id="toast"></div><div id="main"></div></main>
 </div>
</div>

<script>
const sb=supabase.createClient("https://oedyspddtgniuiderpox.supabase.co","sb_publishable_2DaViVS7ziIaUizlmPW4fA_MOkxNanp",{auth:{storageKey:"ayu-admin-auth",persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const B="ayu-media",D="ayu-docs";
const STAT={draft:"Draft",submitted:"Submitted",under_review:"Under review",approved:"Approved",rejected:"Rejected"};
const TITLES={dashboard:"Dashboard","owner-tree":"Owner Direct Tree",distributors:"Distributors","distributor-accounts":"Distributor Accounts",users:"Users & Accounts",products:"Products",gallery:"Gallery",content:"Website Content",settings:"Settings"};
let me=null,cur="dashboard",DL=[],activeDistributorId=null,activeDistributorPhotoPath=null,refreshingDistributor=false;

function toast(t,err){$("toast").innerHTML=t?`<div class="msg ${err?"err":""}">${esc(t)}</div>`:"";if(t)scrollTo(0,0)}
function showLogin(m){$("app").classList.add("hide");$("login").classList.remove("hide");$("lmsg").innerHTML=m?`<div class="msg err">${esc(m)}</div>`:""}
async function gate(){
  const{data:{session}}=await sb.auth.getSession();
  if(!session)return showLogin();
  const{data:p}=await sb.from("ayu_profiles").select("role,full_name").eq("id",session.user.id).maybeSingle();
  if(!p||p.role!=="admin"){await sb.auth.signOut();return showLogin("Invalid credentials or this account is not authorised.")}
  me={...p,id:session.user.id,email:session.user.email};
  $("login").classList.add("hide");$("app").classList.remove("hide");$("who").textContent=me.email;
  go(location.hash.slice(1)||"dashboard");
}
$("lf").onsubmit=async e=>{
  e.preventDefault();$("lgo").disabled=true;$("lmsg").innerHTML="";
  const{error}=await sb.auth.signInWithPassword({email:$("em").value.trim(),password:$("pw").value});
  $("lgo").disabled=false;
  if(error)return showLogin("Invalid credentials or this account is not authorised.");
  $("pw").value="";gate();
};
$("out").onclick=async()=>{await sb.auth.signOut();me=null;location.hash="";showLogin()};
sb.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT"&&me){me=null;showLogin()}});
$("burger").onclick=()=>$("side").classList.toggle("open");
$("nav").onclick=e=>{const s=e.target.dataset.s;if(s){location.hash=s;$("side").classList.remove("open")}};
addEventListener("hashchange",()=>{if(me)go(location.hash.slice(1)||"dashboard")});
document.addEventListener("click",e=>{if(!$("side").contains(e.target)&&e.target!==$("burger"))$("side").classList.remove("open")});

function go(s){
  const [route,targetId]=s.split("/");
  if(!TITLES[route])s="dashboard";else s=route;cur=s;toast("");
  $("title").textContent=TITLES[s];
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.s===s));
  $("main").innerHTML='<div class="card"><small>Loading…</small></div>';
  const page=({dashboard,"owner-tree":ownerTree,distributors,"distributor-accounts":distributorAccounts,users,products,gallery,content,settings})[s];
  (s==="distributor-accounts"&&targetId?page(decodeURIComponent(targetId)):page()).catch(err=>{$("main").innerHTML="";toast(err.message||String(err),true)});
}
const cnt=async(t,f)=>{let q=sb.from(t).select("*",{count:"exact",head:true});if(f)q=f(q);const{count,error}=await q;if(error)throw error;return count||0};
const fmt=d=>d?new Date(d).toLocaleDateString():"—";
async function selectAllPages(queryFactory){
  const pageSize=1000,rows=[];
  for(let offset=0;;offset+=pageSize){
    const{data,error}=await queryFactory().range(offset,offset+pageSize-1);
    if(error)return{data:null,error};
    rows.push(...(data||[]));
    if(!data||data.length<pageSize)return{data:rows,error:null};
  }
}

async function ownerTree(){
  const settings=await sb.from("ayu_site_settings").select("owner_name").eq("id",1).maybeSingle();
  const ownerName=settings.data?.owner_name||"Robiul Awal CMD";
  const{data,error}=await sb.from("ayu_distributors").select("user_id,distributor_code,full_name,contact_person,business_name,parent_id,sponsor_id,position,network_status,status,created_at").order("created_at",{ascending:false});
  if(error){toast(error.message,true);return}
  const rows=data||[];
  let scale=1,panX=0,panY=0,drag=false,startX=0,startY=0;
  const name=d=>d.full_name||d.contact_person||d.business_name||"Distributor";
  const kids=(id,pos)=>rows.filter(d=>d.parent_id===id&&d.position===pos);
  const count=(id,out=0)=>{const children=rows.filter(d=>d.parent_id===id);children.forEach(d=>out+=1+count(d.user_id));return out};
  const node=d=>{
    const left=kids(d.user_id,"LEFT"),right=kids(d.user_id,"RIGHT");
    const available=rows.filter(x=>x.user_id!==d.user_id);
    const picker=position=>`<div class="owner-tree-picker"><select data-tree-member="${position}" data-parent="${d.user_id}"><option value="">Select ID / name</option>${available.map(x=>`<option value="${x.user_id}">${esc(x.distributor_code||x.user_id)} - ${esc(name(x))}</option>`).join("")}</select><button class="ghost sm" data-tree-add="${position}" data-parent="${d.user_id}">Add ${position}</button></div>`;
    const branch=(list,pos)=>`<div class="owner-node"><div class="owner-node-label">${pos} TEAM</div>${list[0]?node(list[0]):picker(pos.toUpperCase())}</div>`;
    return `<div class="owner-org"><div class="owner-card ${posClass(d)}" data-profile="${d.user_id}" data-search="${esc((name(d)+" "+(d.distributor_code||"")).toLowerCase())}">${esc(name(d))}<small>${esc(d.distributor_code||"")} · ${esc(d.network_status||"ACTIVE")}</small><small>${count(d.user_id)} in downline</small><button class="danger sm owner-node-remove" data-owner-remove="${d.user_id}">Remove from tree</button></div><div class="owner-children">${branch(left,"Left")}${branch(right,"Right")}</div></div>`;
  };
  const posClass=()=>"";
  const roots=rows.filter(d=>!d.parent_id);
  const leftRoot=roots.find(d=>d.position=== "LEFT");
  const rightRoot=roots.find(d=>d.position=== "RIGHT");
  const rootBranch=(root,label)=>root?node(root):`<div class="owner-slot"><b>Open ${label} Position</b><br><small>Assign a distributor from the Distributors page</small></div>`;
  const descendants=root=>{if(!root)return [];const found=[];const walk=id=>{rows.filter(d=>d.parent_id===id).forEach(d=>{found.push(d);walk(d.user_id)})};walk(root.user_id);return found};
  const roster=(root,label)=>{const team=descendants(root);const members=root?[root,...team]:[];return `<details class="owner-roster"><summary>${label} Team · ${members.length} distributor${members.length===1?"":"s"}</summary><div class="owner-roster-list">${members.length?members.map(d=>`<div class="owner-roster-row" data-profile="${d.user_id}"><span><b>${esc(d.distributor_code||"No ID")}</b><br><small>${esc(name(d))}</small></span><span class="badge">${esc(d.network_status||"ACTIVE")}</span></div>`).join(""):"<small>No distributors assigned.</small>"}</div></details>`};
  const listRows=()=>rows.map(d=>{const assigned=!!d.parent_id||!!d.position;const sponsor=rows.find(x=>x.user_id===d.parent_id||x.user_id===d.sponsor_id);return `<tr data-owner-list-row data-assigned="${assigned?"assigned":"unassigned"}" data-search="${esc((name(d)+" "+(d.distributor_code||"")).toLowerCase())}"><td><b>${esc(name(d))}</b><br><small>${esc(d.distributor_code||"No ID")}</small></td><td>${d.created_at?fmt(d.created_at):"—"}</td><td><span class="badge">${esc(d.network_status||d.status||"ACTIVE")}</span></td><td>${sponsor?esc(sponsor.distributor_code||name(sponsor)):"Owner"}</td><td>${d.position||"—"}</td><td><span class="badge">${assigned?"Assigned":"Available"}</span></td><td><div style="display:flex;gap:6px;flex-wrap:wrap">${assigned?`<button class="danger sm" data-owner-remove="${d.user_id}">Remove from tree</button>`:`<button class="ghost sm" data-owner-add="LEFT" data-distributor="${d.user_id}">Add Left</button> <button class="ghost sm" data-owner-add="RIGHT" data-distributor="${d.user_id}">Add Right</button>`}<button class="danger sm" data-distributor-delete="${d.user_id}">Remove distributor</button></div></td></tr>`}).join("");
  $("main").innerHTML=`<div class="card"><div class="owner-distributor-heading"><div><h2>Registered Distributors</h2><small>${rows.length} total · ${rows.filter(d=>d.parent_id||d.position).length} assigned · ${rows.filter(d=>!d.parent_id&&!d.position).length} available</small></div></div><div class="owner-tree-toolbar"><input id="owner-list-search" type="search" placeholder="Search name or distributor ID"><select id="owner-list-filter"><option value="all">All distributors</option><option value="assigned">Assigned</option><option value="unassigned">Unassigned</option></select></div><div class="owner-distributor-table"><table><thead><tr><th>Distributor</th><th>Registered</th><th>Status</th><th>Sponsor</th><th>Position</th><th>Assignment</th><th>Action</th></tr></thead><tbody>${listRows()}</tbody></table></div></div><div class="card"><div class="owner-rosters">${roster(leftRoot,"LEFT")}${roster(rightRoot,"RIGHT")}</div><div class="owner-tree-toolbar"><input id="owner-search" type="search" placeholder="Search tree"><button class="ghost" id="tree-out" title="Zoom out">-</button><button class="ghost" id="tree-in" title="Zoom in">+</button><button class="ghost" id="tree-reset" title="Reset view">Reset</button><button class="ghost" id="tree-expand">Expand all</button><button class="ghost" id="tree-collapse">Collapse all</button><button class="ghost" id="tree-refresh">Refresh</button></div><div class="owner-tree-viewport" id="owner-viewport"><div class="owner-tree-canvas" id="owner-canvas"><div class="owner-org"><div class="owner-card owner-root">${esc(ownerName)}<small>OWNER · AYU LIFE HEARBAL</small></div><div class="owner-children"><div class="owner-node"><div class="owner-node-label">LEFT TEAM</div>${rootBranch(leftRoot,"LEFT")}</div><div class="owner-node"><div class="owner-node-label">RIGHT TEAM</div>${rootBranch(rightRoot,"RIGHT")}</div></div></div></div></div><small>Drag to move · Use + / - to zoom · Click a distributor to open the profile</small>`;
  const canvas=$("owner-canvas"),viewport=$("owner-viewport");

  $("tree-in").onclick=()=>{scale=Math.min(2,scale+.1);apply()};$("tree-out").onclick=()=>{scale=Math.max(.35,scale-.1);apply()};$("tree-reset").onclick=()=>{scale=1;panX=0;panY=0;apply()};

  $("owner-list-search").oninput=filterOwnerList;$("owner-list-filter").onchange=filterOwnerList;
  $("tree-expand").onclick=()=>document.querySelectorAll("details.owner-org-details").forEach(d=>d.open=true);

  async function assignRootDistributor(d,position){

    if(slotError)return toast(slotError.message,true);if(occupied?.length)return toast("The "+position+" root position is already occupied.",true);
    const{error}=await sb.from("ayu_distributors").update({parent_id:null,sponsor_id:null,position}).eq("user_id",d.user_id).is("parent_id",null);

    e.stopPropagation();

    button.disabled=true;

      const{storageWarning}=await deleteDistributorAccount(d.user_id);

    toast("Distributor added to "+position+" team.");await ownerTree();
  });
}

async function toWebp(file,max){
  if(file.type==="image/svg+xml")return{blob:file,ext:"svg",type:file.type};
  const bmp=await createImageBitmap(file),k=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  return{blob:await new Promise(r=>c.toBlob(r,"image/webp",.84)),ext:"webp",type:"image/webp"};
}
async function upload(file,folder,max=1600){
  const o=await toWebp(file,max),path=`${folder}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${o.ext}`;
  const{error}=await sb.storage.from(B).upload(path,o.blob,{contentType:o.type,cacheControl:"31536000"});
  if(error)throw error;return sb.storage.from(B).getPublicUrl(path).data.publicUrl;
}

  <div class="row">${img("l",s.logo_url)}<div class="grow"><b>Company logo</b><br><input type="file" id="f-l" accept="image/*"></div></div>
  <div class="row">${img("b",s.banner_url)}<div class="grow"><b>Home banner</b><br><input type="file" id="f-b" accept="image/*"></div></div>
  <label>Phone</label><input type="text" id="s-contact_phone"><label>Email</label><input type="text" id="s-contact_email"><label>Address</label><textarea id="s-contact_address"></textarea></div>
  <button id="sv">Save changes</button>`;
  SF.forEach(f=>$("s-"+f).value=s[f]||"");
  $("sv").onclick=async e=>{
    e.target.disabled=true;
    try{
      const u={updated_at:new Date().toISOString()};SF.forEach(f=>u[f]=$("s-"+f).value.trim()||null);
      for(const[id,col,folder,max]of[["f-o","owner_photo_url","owner",1200],["f-l","logo_url","branding",800],["f-b","banner_url","branding",2000]]){
        const f=$(id).files[0];if(!f)continue;u[col]=await upload(f,folder,max);await removeFile(s[col]);
      }
      const{error}=await sb.from("ayu_site_settings").update(u).eq("id",1);if(error)throw error;
      await content();toast("Saved. The public website is updated.");
    }catch(err){toast(err.message||String(err),true);e.target.disabled=false}
  };
}

/* ---------- settings ---------- */
async function settings(){
  $("main").innerHTML=`<div class="card"><h2>Account</h2><div class="kv"><small>Signed in as</small><div>${esc(me.email)}</div></div></div>
  <div class="card"><h2>Change password</h2><label style="margin-top:0">New password (min. 10 characters)</label><input type="password" id="np" autocomplete="new-password"><label>Repeat new password</label><input type="password" id="np2" autocomplete="new-password"><p style="margin:14px 0 0"><button id="cp">Update password</button></p></div>`;
  $("cp").onclick=async e=>{
    const a=$("np").value;if(a.length<10)return toast("Use at least 10 characters.",true);
    if(a!==$("np2").value)return toast("Passwords do not match.",true);
    e.target.disabled=true;const{error}=await sb.auth.updateUser({password:a});e.target.disabled=false;
    if(error)return toast(error.message,true);$("np").value=$("np2").value="";toast("Password updated.");
  };
}
gate();
setInterval(()=>{if(me&&cur==="distributors"&&activeDistributorId)refreshDistributorDetail(activeDistributorId)},10000);
setInterval(()=>{if(me&&cur==="distributors"&&!activeDistributorId)distributors()},60000);
</script>
